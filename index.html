<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>چوب‌راز</title>
<style>
  :root { --bg:#f4ede4; --card:#fffaf4; --ink:#3b2a1d; --muted:#8a7461; --accent:#7a4b2a; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1712; --card:#2a211a; --ink:#f1e6da; --muted:#b19d8a; --accent:#d09a6a; --err:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--ink); font-family:Tahoma, system-ui, sans-serif; }
  form { width:100%; max-width:340px; background:var(--card); padding:28px 24px; border-radius:14px;
         box-shadow:0 6px 24px rgba(0,0,0,.08); text-align:center; }
  h1 { margin:0 0 6px; font-size:26px; color:var(--accent); }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input[type=password] { width:100%; padding:12px; font-size:16px; border:1px solid var(--muted);
         border-radius:8px; background:transparent; color:var(--ink); text-align:center; }
  label { display:flex; gap:6px; align-items:center; justify-content:center; margin:14px 0; font-size:13px; color:var(--muted); }
  button { width:100%; padding:12px; font-size:16px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:var(--err); font-size:13px; min-height:18px; margin-top:12px; }
</style>
</head>
<body>
<form id="f">
  <h1>چوب‌راز</h1>
  <p>برای دیدن کاتالوگ، رمز را وارد کنید.</p>
  <input type="password" id="pw" placeholder="رمز" autocomplete="current-password" autofocus required>
  <label><input type="checkbox" id="rem" checked> مرا به خاطر بسپار</label>
  <button id="go">ورود</button>
  <div class="err" id="err"></div>
</form>

const KEY = "choobraz-key";
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
const unhex = h => Uint8Array.from(h.match(/../g), x => parseInt(x, 16));

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name:"PBKDF2", hash:"SHA-256", salt:u8(D.salt), iterations:D.iter }, base, 512);
}

async function open(bits, onOk) {
  bits = new Uint8Array(bits);
  const iv = u8(D.iv), data = u8(D.data);
  const mac = await crypto.subtle.importKey("raw", bits.slice(32), { name:"HMAC", hash:"SHA-256" }, false, ["verify"]);
  const msg = new Uint8Array(iv.length + data.length); msg.set(iv); msg.set(data, iv.length);
  if (!await crypto.subtle.verify("HMAC", mac, u8(D.tag), msg)) return false;
  const k = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-CBC", iv }, k, data));
  if (onOk) onOk();
  document.open(); document.write(html); document.close();
  return true;
}

function store(fn) { try { fn(); } catch (e) {} }

(async () => {
  let saved = null;
  store(() => { saved = localStorage.getItem(KEY); });
  if (saved && await open(unhex(saved).buffer)) return;
  if (saved) store(() => localStorage.removeItem(KEY));
})();

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  const bits = await derive(document.getElementById("pw").value);
  const remember = document.getElementById("rem").checked;
  const ok = await open(bits, () => { if (remember) store(() => localStorage.setItem(KEY, hex(bits))); });
  if (!ok) {
    err.textContent = "رمز اشتباه است";
    btn.disabled = false;
  }
});
